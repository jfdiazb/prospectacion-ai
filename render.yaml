services:
  - type: web
    name: alma-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: AI_MODE
        value: live
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_MESSAGING_MODE
        value: live
      - key: YOUTUBE_INGESTION_MODE
        value: live
      - key: YOUTUBE_HUNTER_MODE
        value: live
      - key: YOUTUBE_HUNTER_USER_DAILY_SEARCH_LIMIT
        value: "25"
      - key: YOUTUBE_POLL_OVERLAP_MS
        value: "3600000"
      - key: YOUTUBE_REPLY_POLL_INTERVAL_MS
        value: "120000"
      - key: YOUTUBE_REPLY_ACTIVE_DAYS
        value: "7"
      - key: YOUTUBE_REPLY_MAX_THREADS
        value: "8"
      - key: ZOOM_MODE
        value: live
      - key: SCHEDULING_MODE
        value: calendly
      - key: CALENDLY_BOOKING_URL
        sync: false
      - key: CALENDLY_WEBHOOK_SIGNING_KEY
        sync: false
      - key: CALENDLY_WEBHOOK_SECRET
        sync: false
      - key: CALENDLY_PERSONAL_ACCESS_TOKEN
        sync: false
      - key: CALENDLY_POLL_INTERVAL_MS
        value: 120000
      - key: CALENDLY_LOOKAHEAD_DAYS
        value: 90
      - key: CALENDLY_TIMEOUT_MS
        value: 10000
      - key: INSTAGRAM_MESSAGING_MODE
        value: mock
      - key: WHATSAPP_MESSAGING_MODE
        value: mock
      - key: WHATSAPP_AUTO_REPLY_ENABLED
        value: "false"
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: META_MOCK_MODE
        value: "false"
