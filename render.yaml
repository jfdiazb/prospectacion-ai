services:
  - type: web
    name: alma-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: AI_MODE
        value: mock
      - key: YOUTUBE_MESSAGING_MODE
        value: mock
      - key: ZOOM_MODE
        value: mock
      - key: INSTAGRAM_MESSAGING_MODE
        value: mock
      - key: WHATSAPP_MESSAGING_MODE
        value: mock
      - key: WHATSAPP_AUTO_REPLY_ENABLED
        value: "false"
      - key: META_MOCK_MODE
        value: "false"
