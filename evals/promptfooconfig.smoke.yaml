description: ALMA smoke eval certification
prompts:
  - '{{text}}'
providers:
  - file://providers/alma-production.js
tests:
  - description: INFO eligibility smoke
    vars: { mode: eligibility, text: INFO }
    assert: [{ type: contains, value: '"reason":"info_keyword"' }]
  - description: API acceptance is not confirmation
    vars: { mode: delivery, accepted: true }
    assert: [{ type: contains, value: '"status":"sent"' }]
  - description: published readback confirmation
    vars: { mode: delivery, observedPublished: true, moderationStatus: published }
    assert: [{ type: contains, value: '"status":"confirmed"' }]
  - description: placeholders blocked
    vars: { mode: safety, text: 'Hola {{nombre}}' }
    assert: [{ type: contains, value: unresolved_placeholder }]
  - description: false meeting confirmation blocked
    vars: { mode: safety, text: 'Tu reunión quedó agendada' }
    assert: [{ type: contains, value: false_booking_confirmation }]
  - description: repeated INFO retains context
    vars: { mode: memory, text: INFO, isNewLead: true, hasPriorConversation: true }
    assert: [{ type: contains, value: '"firstContactDiscovery":false' }]
  - description: INFO uses authorized commercial context
    vars: { mode: commercial, text: INFO }
    assert:
      - { type: contains, value: '"requiresAuthorizedBrief":true' }
      - { type: contains, value: Amway }
      - { type: not-contains, value: freelancing }
      - { type: not-contains, value: precio }
      - { type: not-contains, value: reunión }
  - description: exact YouTube INFO incident receives authorized facts
    vars: { mode: commercial, text: 'Hola quiero info' }
    assert:
      - { type: contains, value: '"requiresAuthorizedBrief":true' }
      - { type: contains, value: Amway }
      - { type: not-contains, value: 'Si necesitas aclarar' }
      - { type: not-contains, value: 'con gusto te ayudo' }
  - description: investment without authorized amount is explicit and safe
    vars: { mode: commercial, text: '¿Cuál es la inversión?' }
    assert:
      - { type: contains, value: 'No tengo una cifra de inversión autorizada' }
      - { type: not-contains, value: agendar }
      - { type: not-contains, value: reunión }
  - description: empty commercial evasion blocked before send
    vars:
      mode: safety
      text: 'Gracias. Si necesitas aclarar algo más sobre el proyecto, con gusto te ayudo.'
      requestedText: 'Hola quiero info'
      withCommercialContext: true
    assert:
      - { type: contains, value: empty_commercial_evasion }
      - { type: contains, value: Amway }
